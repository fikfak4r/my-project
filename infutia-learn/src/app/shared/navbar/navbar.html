<nav class="navbar navbar-expand-lg il-nav" [class.il-nav--scrolled]="scrolled()" aria-label="Main">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <span class="brand-mark"><i class="bi bi-triangle-half"></i></span>
      <span class="brand-name">Infutia<em>Learn</em></span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#ilNav" aria-label="Menu" (click)="open.set(!open())">
      <i class="bi" [class.bi-list]="!open()" [class.bi-x-lg]="open()"></i>
    </button>

    <div class="collapse navbar-collapse" id="ilNav">
      <ul class="navbar-nav mx-auto mb-3 mb-lg-0 gap-lg-1">
        @for (l of links; track l.path) {
          <li class="nav-item">
            <a class="nav-link" routerLink [routerLinkActive]="'is-active'" [routerLinkActiveOptions]="{ exact: l.path === '/' }">{{ l.label }}</a>
          </li>
        }
      </ul>
      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 nav-actions">
        @if (auth.session(); as session) {
          <div class="il-user-chip">
            <a class="il-user-chip__avatar" routerLink="/studio"
               [style.background]="'linear-gradient(150deg,' + session.avatarFrom + ',' + session.avatarTo + ')'"
               [title]="session.name">{{ session.initials }}</a>
            <span class="il-user-chip__name d-none d-lg-inline">{{ session.name }}</span>
            <a class="btn btn-il-primary btn-sm ms-lg-2" routerLink="/studio">
              <i class="bi bi-speedometer2 me-1"></i> Studio
            </a>
            <button type="button" class="btn il-user-chip__out" (click)="auth.logout()" title="Sign out">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        } @else {
          <a class="btn btn-il-ghost btn-sm" routerLink="/courses"><i class="bi bi-search me-1"></i> Browse</a>
          <a class="btn btn-il-ghost btn-sm" routerLink="/login"><i class="bi bi-box-arrow-in-right me-1"></i> Author Login</a>
          <a class="btn btn-il-primary btn-sm" routerLink="/login?mode=signup"><i class="bi bi-feather me-1"></i> Become an Author</a>
        }
      </div>
    </div>
  </div>
</nav>
